# 푸시·PR 마다 타입 → 린트 → 테스트 → 빌드를 돌린다.
#
# Secret 이 하나도 필요 없다.
#   - SQL 테스트는 PGlite(메모리 안의 Postgres)에 drizzle/ 마이그레이션을 직접 적용해 본다.
#     진짜 DB 에는 붙지 않는다.
#   - 빌드는 Supabase 값의 **형식**만 맞으면 된다. DB 연결은 첫 요청 때 만든다 (lib/core/db.ts).
#
# Node 는 로컬 개발과 같은 24. vitest 5 는 22.12 이상이어야 돈다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새로 푸시하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .npmrc 의 legacy-peer-deps 를 그대로 따른다
      - run: npm ci

      # RouteContext<'/api/...'> 같은 라우트 타입은 생성해야 생긴다. 없으면 tsc 가 실패한다
      - name: 라우트 타입 생성
        run: npx next typegen

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
