# 무료 티어에는 백업이 없다. 이 워크플로가 그걸 대신한다.
#
# 필요한 GitHub Secret 2개:
#   SUPABASE_DB_URL   : 세션 풀러 연결 문자열 (aws-0-<region>.pooler.supabase.com:5432, 사용자 postgres.<ref>)
#                       직접 연결(db.<ref>.supabase.co)은 IPv6 전용인데 GitHub 러너는 IPv4 뿐이라 붙지 않는다.
#                       트랜잭션 풀러(6543)도 아니다 — pg_dump 는 세션 하나를 길게 쓴다.
#   BACKUP_PASSPHRASE : 덤프 암호화 비밀번호. 이 레포는 public 이고 아티팩트는 로그인한 누구나 받을 수 있다.
#                       그래서 평문 덤프는 올리지 않는다. 잃어버리면 백업도 못 연다 — 따로 적어 둔다.
#
# 복원: gh run download <run-id> -n db-backup
#       gpg -d backup-XXXX.sql.gz.gpg | gunzip > backup.sql
# 보존: 90일. 덤프는 gzip 된 plain SQL 이라 5인 팀 규모면 수 MB 수준이다.
# 범위: public 스키마만. 로그인 계정(auth 스키마)과 Storage 에 올린 파일은 들어가지 않는다.
name: nightly-db-backup

on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST (UTC+9)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump 17 설치
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: 덤프 + 암호화
        env:
          PGURL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$PGURL" || { echo "SUPABASE_DB_URL secret 이 없습니다"; exit 1; }
          # 암호 없이 올리느니 실패한다
          test -n "$PASSPHRASE" || { echo "BACKUP_PASSPHRASE secret 이 없습니다 (평문 덤프는 올리지 않는다)"; exit 1; }
          STAMP=$(date -u +%Y%m%d-%H%M)
          # 평문은 업로드 경로(작업 디렉터리) 밖에 둔다
          PLAIN="$RUNNER_TEMP/backup.sql.gz"
          pg_dump "$PGURL" \
            --schema=public \
            --no-owner --no-privileges \
            --format=plain \
          | gzip -9 > "$PLAIN"
          # 내용이 비었으면 실패시킨다 (조용한 빈 백업이 최악이다)
          test "$(stat -c%s "$PLAIN")" -gt 1024
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --output "backup-${STAMP}.sql.gz.gpg" "$PLAIN" 3<<<"$PASSPHRASE"
          rm -f "$PLAIN"
          ls -lh backup-*.sql.gz.gpg

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
